services:
  - type: web
    name: smart-sembako-bot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: MERCHANT_ID
        value: merchant_smart_sembako
      - key: TENANT_ISOLATION_REQUIRED
        value: "false"
      - key: STORE_TIMEZONE
        value: Asia/Jakarta
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_SECRET_TOKEN
        sync: false
      - key: DESKTOP_SHARED_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OWNER_TELEGRAM_IDS
        sync: false
      - key: SCHEDULER_ENABLED
        value: "true"
